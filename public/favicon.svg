<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Master Background Radial Aura -->
    <radialGradient id="sq-bg-aura" cx="256" cy="256" r="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#27B7F5" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#786BFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Master Signal Gradient (Electric Mint -> Azure Blue -> Cyber Violet) -->
    <linearGradient id="sq-signal" x1="74" y1="74" x2="438" y2="438" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#55F3D2"/>
      <stop offset="48%" stop-color="#27B7F5"/>
      <stop offset="100%" stop-color="#786BFF"/>
    </linearGradient>

    <!-- Radar Sweep Sector Gradient -->
    <linearGradient id="sq-sweep" x1="256" y1="256" x2="436" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#27B7F5" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#2CD8D0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#55F3D2" stop-opacity="0.65"/>
    </linearGradient>

    <!-- Chamfer Rim Gradient -->
    <linearGradient id="sq-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55F3D2" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#27B7F5" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#786BFF" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Precision Signal Glow -->
    <filter id="sq-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.15  0 0 0 0 0.85  0 0 0 0 0.95  0 0 0 0.45 0" result="colored"/>
      <feMerge>
        <feMergeNode in="colored"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Beacon Lock Flare -->
    <filter id="sq-flare" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="f1"/>
      <feGaussianBlur stdDeviation="12" result="f2"/>
      <feMerge>
        <feMergeNode in="f2"/>
        <feMergeNode in="f1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Pitch Black OLED Housing -->
  <rect width="512" height="512" rx="128" fill="#000000"/>
  <rect x="2" y="2" width="508" height="508" rx="126" fill="none" stroke="url(#sq-rim)" stroke-width="2"/>

  <!-- Ambient Radar Aura -->
  <circle cx="256" cy="256" r="236" fill="url(#sq-bg-aura)"/>

  <!-- Symbol Graphic Group -->
  <g filter="url(#sq-glow)">
    <!-- Outer Scope Framing Accent -->
    <circle cx="256" cy="256" r="204" stroke="#27B7F5" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="5 7"/>

    <!-- Compass Degree Ticks -->
    <line x1="440.0" y1="256.0" x2="450.0" y2="256.0" stroke="#55F3D2" stroke-width="3.0" stroke-linecap="round" opacity="0.85" />
    <line x1="433.7" y1="303.6" x2="437.6" y2="304.7" stroke="#78DCD9" stroke-width="1.2" stroke-linecap="round" opacity="0.25" />
    <line x1="415.3" y1="348.0" x2="421.4" y2="351.5" stroke="#78DCD9" stroke-width="2.0" stroke-linecap="round" opacity="0.5" />
    <line x1="386.1" y1="386.1" x2="388.9" y2="388.9" stroke="#78DCD9" stroke-width="1.2" stroke-linecap="round" opacity="0.25" />
    <line x1="348.0" y1="415.3" x2="351.5" y2="421.4" stroke="#78DCD9" stroke-width="2.0" stroke-linecap="round" opacity="0.5" />
    <line x1="303.6" y1="433.7" x2="304.7" y2="437.6" stroke="#78DCD9" stroke-width="1.2" stroke-linecap="round" opacity="0.25" />
    <line x1="256.0" y1="440.0" x2="256.0" y2="450.0" stroke="#55F3D2" stroke-width="3.0" stroke-linecap="round" opacity="0.85" />
    <line x1="208.4" y1="433.7" x2="207.3" y2="437.6" stroke="#78DCD9" stroke-width="1.2" stroke-linecap="round" opacity="0.25" />
    <line x1="164.0" y1="415.3" x2="160.5" y2="421.4" stroke="#78DCD9" stroke-width="2.0" stroke-linecap="round" opacity="0.5" />
    <line x1="125.9" y1="386.1" x2="123.1" y2="388.9" stroke="#78DCD9" stroke-width="1.2" stroke-linecap="round" opacity="0.25" />
    <line x1="96.7" y1="348.0" x2="90.6" y2="351.5" stroke="#78DCD9" stroke-width="2.0" stroke-linecap="round" opacity="0.5" />
    <line x1="78.3" y1="303.6" x2="74.4" y2="304.7" stroke="#78DCD9" stroke-width="1.2" stroke-linecap="round" opacity="0.25" />
    <line x1="72.0" y1="256.0" x2="62.0" y2="256.0" stroke="#55F3D2" stroke-width="3.0" stroke-linecap="round" opacity="0.85" />
    <line x1="78.3" y1="208.4" x2="74.4" y2="207.3" stroke="#78DCD9" stroke-width="1.2" stroke-linecap="round" opacity="0.25" />
    <line x1="96.7" y1="164.0" x2="90.6" y2="160.5" stroke="#78DCD9" stroke-width="2.0" stroke-linecap="round" opacity="0.5" />
    <line x1="125.9" y1="125.9" x2="123.1" y2="123.1" stroke="#78DCD9" stroke-width="1.2" stroke-linecap="round" opacity="0.25" />
    <line x1="164.0" y1="96.7" x2="160.5" y2="90.6" stroke="#78DCD9" stroke-width="2.0" stroke-linecap="round" opacity="0.5" />
    <line x1="208.4" y1="78.3" x2="207.3" y2="74.4" stroke="#78DCD9" stroke-width="1.2" stroke-linecap="round" opacity="0.25" />
    <line x1="256.0" y1="72.0" x2="256.0" y2="62.0" stroke="#55F3D2" stroke-width="3.0" stroke-linecap="round" opacity="0.85" />
    <line x1="303.6" y1="78.3" x2="304.7" y2="74.4" stroke="#78DCD9" stroke-width="1.2" stroke-linecap="round" opacity="0.25" />
    <line x1="348.0" y1="96.7" x2="351.5" y2="90.6" stroke="#78DCD9" stroke-width="2.0" stroke-linecap="round" opacity="0.5" />
    <line x1="386.1" y1="125.9" x2="388.9" y2="123.1" stroke="#78DCD9" stroke-width="1.2" stroke-linecap="round" opacity="0.25" />
    <line x1="415.3" y1="164.0" x2="421.4" y2="160.5" stroke="#78DCD9" stroke-width="2.0" stroke-linecap="round" opacity="0.5" />
    <line x1="433.7" y1="208.4" x2="437.6" y2="207.3" stroke="#78DCD9" stroke-width="1.2" stroke-linecap="round" opacity="0.25" />

    <!-- Master Scope Boundary Ring -->
    <circle cx="256" cy="256" r="180" stroke="url(#sq-signal)" stroke-width="12"/>

    <!-- Concentric Range Rings -->
    <circle cx="256" cy="256" r="130" stroke="#55F3D2" stroke-opacity="0.35" stroke-width="3.5"/>
    <circle cx="256" cy="256" r="78" stroke="#27B7F5" stroke-opacity="0.30" stroke-width="3"/>
    <circle cx="256" cy="256" r="36" stroke="#786BFF" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Reticle Crosshair Axes -->
    <path d="M256 66V446M66 256H446" stroke="#78DCD9" stroke-opacity="0.20" stroke-width="2.5"/>

    <!-- 45-degree Alignment Ticks -->
    <path d="M158 108L178 128M334 334L354 354" stroke="#58D9D8" stroke-opacity="0.55" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M354 158L334 178M178 334L158 354" stroke="#58D9D8" stroke-opacity="0.28" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Active 90-Degree Radar Sweep Sector (12 to 3 o'clock) -->
    <path d="M256 256 L256 76 A180 180 0 0 1 436 256 Z" fill="url(#sq-sweep)"/>

    <!-- Sweep Trailing Edge Ray -->
    <path d="M256 256 L256 76" stroke="#6BEBD6" stroke-opacity="0.6" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Leading Sweep Ray -->
    <path d="M256 256 L383 129" stroke="url(#sq-signal)" stroke-width="7" stroke-linecap="round"/>

    <!-- Luminous Energized Arc along outer perimeter under sweep -->
    <path d="M256 76 A180 180 0 0 1 383 129" fill="none" stroke="#55F3D2" stroke-width="15" stroke-linecap="round"/>

    <!-- Central Transceiver Emitter Core -->
    <circle cx="256" cy="256" r="20" fill="#000000" stroke="#55F3D2" stroke-width="4"/>
    <circle cx="256" cy="256" r="11" fill="#F4FFFF"/>
    <circle cx="256" cy="256" r="5" fill="#20C9CE"/>

    <!-- Peripheral Signal Hits -->
    <circle cx="156" cy="301" r="7" fill="#55CFF1"/>
    <circle cx="310" cy="352" r="6" fill="#8C83FF"/>
    <circle cx="186" cy="180" r="5" fill="#55F3D2" opacity="0.65"/>
  </g>

  <!-- Primary Target Acquired (Career Opportunity Beacon!) -->
  <g transform="translate(348, 164)" filter="url(#sq-flare)">
    <circle cx="0" cy="0" r="24" fill="none" stroke="#55F3D2" stroke-opacity="0.38" stroke-width="2.5" stroke-dasharray="5 4"/>
    <circle cx="0" cy="0" r="14" fill="#55F3D2" fill-opacity="0.32"/>
    <path d="M 0 -15 Q 0 0 -15 0 Q 0 0 0 15 Q 0 0 15 0 Q 0 0 0 -15 Z" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>
</svg>