<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Master Signature Instagram Gradient -->
    <linearGradient id="radar-brand-ig" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#833ab4" />
      <stop offset="26%" stop-color="#9b2d97" />
      <stop offset="50%" stop-color="#c13584" />
      <stop offset="70%" stop-color="#e1306c" />
      <stop offset="88%" stop-color="#fd1d1d" />
      <stop offset="100%" stop-color="#f56040" />
    </linearGradient>

    <!-- Inner Echo Pulse Wave Gradient -->
    <linearGradient id="radar-pulse-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#f56040" stop-opacity="0.85" />
      <stop offset="75%" stop-color="#fd1d1d" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#c13584" stop-opacity="0.2" />
    </linearGradient>

    <!-- Squircle Chamfer Border Gradient -->
    <linearGradient id="radar-border-ig" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f56040" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#e1306c" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#833ab4" stop-opacity="0.5" />
    </linearGradient>

    <!-- Ambient Glow behind R -->
    <radialGradient id="ambient-radar" cx="55%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#e1306c" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#833ab4" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Neon Drop Shadow for depth -->
    <filter id="radar-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#e1306c" flood-opacity="0.45" />
    </filter>

    <!-- Opportunity Beacon Flare -->
    <filter id="beacon-flare" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b1" />
      <feGaussianBlur stdDeviation="12" result="b2" />
      <feMerge>
        <feMergeNode in="b2" />
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Pitch Black OLED Housing -->
  <rect width="512" height="512" rx="122" fill="#000000" />
  <rect x="5" y="5" width="502" height="502" rx="117" fill="none" stroke="url(#radar-border-ig)" stroke-width="2.5" />

  <!-- Ambient Radar Aura -->
  <circle cx="280" cy="240" r="210" fill="url(#ambient-radar)" />

  <!-- Screen Capture / OCR Viewfinder Frame (Targeting Corners) -->
  <g stroke="url(#radar-brand-ig)" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.35">
    <path d="M 64 100 V 64 H 100" />
    <path d="M 412 64 H 448 V 100" />
    <path d="M 64 412 V 448 H 100" />
    <path d="M 412 448 H 448 V 412" />
  </g>

  <!-- Concentric Radar Ripple Echoes (Faint Background Signal Waveforms) -->
  <g fill="none" stroke="#262626" opacity="0.45">
    <circle cx="270" cy="226" r="110" stroke-width="2" stroke-dasharray="6 8" />
    <circle cx="270" cy="226" r="172" stroke-width="2" stroke-dasharray="10 12" />
  </g>

  <!-- The Master Iconic "R" Signal Emblem -->
  <g filter="url(#radar-shadow)">
    <!-- 1. Vertical Spine (The Data Capture / Interceptor Stream) -->
    <rect x="116" y="98" width="56" height="316" rx="28" fill="url(#radar-brand-ig)" />

    <!-- 2. Concentric Radar Outer Wave (Lobe of R) -->
    <path d="M 170 124 H 276 C 348 124 402 170 402 228 C 402 286 348 332 276 332 H 170" 
          fill="none" stroke="url(#radar-brand-ig)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 3. Concentric Radar Inner Wave (Echo Pulse of R) -->
    <path d="M 170 182 H 262 C 294 182 320 202 320 228 C 320 254 294 274 262 274 H 170" 
          fill="none" stroke="url(#radar-pulse-grad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 4. Diagonal Laser Interceptor / Career Opportunity Sweep Beam (Kick of R) -->
    <path d="M 266 308 L 386 414" 
          fill="none" stroke="url(#radar-brand-ig)" stroke-width="52" stroke-linecap="round" />
  </g>

  <!-- 5. Optical OCR Aperture / Focal Intelligence Core inside the Loop -->
  <g transform="translate(262, 228)">
    <circle cx="0" cy="0" r="19" fill="#121212" stroke="url(#radar-brand-ig)" stroke-width="6" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
    <!-- Fine optical reticle ticks on sensor -->
    <line x1="0" y1="-26" x2="0" y2="-21" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="0" y1="21" x2="0" y2="26" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="-26" y1="0" x2="-21" y2="0" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="21" y1="0" x2="26" y2="0" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.75" />
  </g>

  <!-- 6. Locked Opportunity Beacon (Detected Target at Apex of Interceptor Kick) -->
  <g transform="translate(390, 416)" filter="url(#beacon-flare)">
    <circle cx="0" cy="0" r="18" fill="#fd1d1d" fill-opacity="0.35" />
    <circle cx="0" cy="0" r="10" fill="#f56040" />
    <path d="M 0 -13 Q 0 0 -13 0 Q 0 0 0 13 Q 0 0 13 0 Q 0 0 0 -13 Z" fill="#ffffff" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>
</svg>
