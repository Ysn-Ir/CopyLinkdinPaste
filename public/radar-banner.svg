<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none">
  <!-- Pitch Black Solid Background -->
  <rect width="1200" height="360" fill="#000000"/>

  <!-- ==================== RADAR SYMBOL ==================== -->
  <g>
    <!-- Scope Boundary Ring: Solid Stark White -->
    <circle cx="180" cy="180" r="126" stroke="#FFFFFF" stroke-width="8" fill="none"/>

    <!-- Concentric Range Rings: Technical Muted Grays -->
    <circle cx="180" cy="180" r="91" stroke="#383838" stroke-width="2" fill="none"/>
    <circle cx="180" cy="180" r="55" stroke="#2B2B2B" stroke-width="2" fill="none"/>

    <!-- Reticle Crosshair Axes -->
    <path d="M180 54V306M54 180H306" stroke="#2E2E2E" stroke-width="2"/>

    <!-- Diagonal Sensor Ticks -->
    <path d="M112 75L128 91M248 269L264 285" stroke="#484848" stroke-width="3" stroke-linecap="round"/>

    <!-- 90-Degree Radar Sweep Sector (Translucent Flat White, Zero Gradient) -->
    <path d="M180 180 L180 54 A126 126 0 0 1 306 180 Z" fill="#FFFFFF" fill-opacity="0.08"/>

    <!-- Sweep Trailing Edge Ray -->
    <path d="M180 180 L180 54" stroke="#555555" stroke-width="2" stroke-linecap="round"/>

    <!-- Solid Stark White Leading Sweep Ray -->
    <path d="M180 180 L269 91" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Outer Rim Arc under sweep -->
    <path d="M180 54 A126 126 0 0 1 269 91" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" fill="none"/>

    <!-- Center Transceiver Core: Solid White & Black -->
    <circle cx="180" cy="180" r="12" fill="#000000" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="180" cy="180" r="5" fill="#FFFFFF"/>

    <!-- Faint Peripheral Signal Hits (Monochrome Technical Grays) -->
    <circle cx="111" cy="211" r="4.5" fill="#505050"/>
    <circle cx="217" cy="246" r="4" fill="#3D3D3D"/>
  </g>

  <!-- ==================== SINGLE CRISP TACTICAL ACCENT BEACON ==================== -->
  <g transform="translate(244, 116)">
    <!-- Ping Ripple Ring -->
    <circle cx="0" cy="0" r="16" fill="none" stroke="#FF3B30" stroke-width="2" stroke-dasharray="4 3" opacity="0.65"/>
    <!-- Solid Red Beacon Node -->
    <circle cx="0" cy="0" r="7" fill="#FF3B30"/>
    <!-- Crisp White Core -->
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- ==================== CLEAN MONOCHROME TYPOGRAPHY ==================== -->
  <g>
    <!-- Solid Stark White Wordmark -->
    <text x="365" y="211" 
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="126" 
          font-weight="800" 
          letter-spacing="8" 
          fill="#FFFFFF">RADAR</text>

    <!-- Clean Track Divider -->
    <path d="M370 250H850" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Accent Terminal Point -->
    <circle cx="862" cy="250" r="4.5" fill="#FF3B30"/>

    <!-- Solid Clean Tagline -->
    <text x="370" y="294" 
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="24" 
          font-weight="600" 
          letter-spacing="6" 
          fill="#737373">CAPTURE  <tspan fill="#FF3B30">·</tspan>  UNDERSTAND  <tspan fill="#FF3B30">·</tspan>  ORGANIZE</text>
  </g>
</svg>